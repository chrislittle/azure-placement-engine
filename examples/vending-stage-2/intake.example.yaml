# A subscription parameter file, as Microsoft's subscription vending guidance
# describes it: "a single YAML, JSON, or TFVARS subscription parameter file for
# the new subscription", one per request, produced by the request pipeline from
# whatever the data collection tool gathered.
#
#   learn.microsoft.com/azure/architecture/landing-zones/subscription-vending
#
# Everything above `compute:` is consumed by STAGE 1 (avm-ptn-sub-vending) and
# is here because a real parameter file carries it. APE reads none of it.
#
# `compute:` is what APE adds. The guidance's deployment-pipeline task table
# covers Identity, Governance, Networking, Budgets and Reporting -- and says
# nothing about quota. CAF names the gap without filling it: "review the
# subscription quota limits before creating the subscription", and "the quota
# request can fail, so you should run a script to handle any errors."
#
# Its vocabulary is Azure's, not ours: `category` takes Compute Fleet's
# vmCategories values, and architecture, burstable and confidential_computing
# are attributes rather than categories, exactly as Azure models them. We do not
# use Compute Fleet -- this is VM vending -- but a request written here would
# need no translation to be handed to it.

request:
  # Trackable request from the ITSM tool or intake portal.
  id: SR-2026-0914-0031
  authorizer: dana.okafor@contoso.com
  cost_center: CC-44120

workload:
  name: contoso-payments-api
  application_platform: virtual-machines
  # Drives management group placement in stage 1.
  criticality: mission-critical         # mission-critical | high | medium | low
  data_sensitivity: confidential        # public | internal | confidential | restricted

subscription:
  display_name: sub-contoso-payments-api-prod-001
  # DevTest carries different terms and lower rates. A billing decision made at
  # intake, not afterwards.
  environment: prod                     # prod | devtest
  owner: payments-platform@contoso.com
  management_group: corp-online
  budget:
    amount: 12000
    currency: USD

networking:
  connectivity: hub-spoke               # internet-only | hub-spoke | on-premises
  address_space: 10.40.0.0/20           # reserved by the IPAM integration

# --- stage 2: APE -------------------------------------------------------
#
# The application team states a workload class. Nobody filling in a subscription
# request knows what standardEDSv5Family is, and they should not have to.
compute:
  region: eastus
  vcpus: 64

  # GeneralPurpose | ComputeOptimized | MemoryOptimized | StorageOptimized
  # GpuAccelerated | FpgaAccelerated | HighPerformanceCompute
  category: MemoryOptimized

  # Optional attributes. Omit one and it is not filtered on.
  architecture: x64                     # x64 | Arm64
  burstable: Excluded                   # Excluded | Required
  # confidential_computing: Required

  # regional | zonal | zone_redundant. Not a preference -- it decides which
  # families are eligible at all, since zone access is granted per SKU size and
  # per zone.
  placement:
    type: zone_redundant
    zone_count: 3

  # Optional, most specific wins. A platform team can narrow the candidates; a
  # team that knows exactly what it wants can pin one outright.
  # family_allowlist: [standardEdsv6Family, standardEsv6Family]
  # family: standardEdsv6Family
