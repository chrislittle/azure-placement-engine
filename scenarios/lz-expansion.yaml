# Scenario 4 — landing-zone expansion.
# Stresses: tenant context as a first-class input, allowedLocations policy as a
# hard whitelist, and the real cost of standing up platform footprint in a new
# region (hub, gateways, DNS, identity, workspace placement).
apiVersion: placement/v0
workload: emea-expansion
owner: platform-ccoe
description: >
  Customer runs in westeurope today and needs region two. The existing estate is
  the dominant input — the engine's job is to respect it, not to re-plan it.

residency:
  cloud: public
  jurisdictions: [eu]
  # Normally populated by the tenant collector from the customer's
  # allowedLocations policy assignment; inline here so the scenario runs
  # without a tenant context file.
  allowed_regions:
    - westeurope
    - northeurope
    - swedencentral
    - francecentral
    - germanywestcentral
    - italynorth
    - polandcentral
    - spaincentral
    - switzerlandnorth
    - norwayeast

horizon: 36mo

demand:
  - geography: eu-west
    share: 0.6
    latency_p99_ms: 40
  - geography: eu-north
    share: 0.4
    latency_p99_ms: 60

components:
  - name: app
    service: Microsoft.ContainerService/managedClusters
    capabilities: [availability-zones, private-cluster]
    capacity:
      capability_class: general
      vcpu: 96
      instances: 12
      growth: 2x/24mo
  - name: db
    service: Microsoft.DBforPostgreSQL/flexibleServers
    capabilities: [zone-redundant-ha, geo-replication]
  - name: files
    service: Microsoft.Storage/storageAccounts
    capabilities: [zone-redundant-storage, geo-redundant-storage]

flows:
  - name: app-transaction
    type: user
    criticality: high
    path: [app, db]
    latency_sensitivity: high
    rto: 1h
    rpo: 5m
    splittable: false

  - name: file-access
    type: system
    criticality: medium
    path: [app, files]
    latency_sensitivity: medium
    rto: 4h
    rpo: 1h

resiliency:
  min_availability_zones: 3

landingZone:
  existing_regions: [westeurope]
  network_anchors:
    - expressroute:amsterdam
    - vwan-hub:westeurope

priorities:
  landing_zone_expansion: 0.35
  latency: 0.25
  cost: 0.20
  region_category: 0.15
  capacity_confidence: 0.05
