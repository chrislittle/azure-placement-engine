# Scenario 2 — data-residency-driven placement.
# Stresses: residency and compliance hard filters, capability-level encryption
# requirements, and two flows in one workload with very different recovery
# targets — the audit path should not be made to pay for the clinical path's RTO.
apiVersion: placement/v0
workload: patient-records
owner: health-data-platform
description: >
  German patient data under GDPR with a national in-country requirement.
  Residency is absolute; everything else is negotiable.

residency:
  cloud: public
  jurisdictions: [de]
  boundaries: [eu-data-boundary]

compliance: [iso-27001, gdpr]

horizon: 36mo

demand:
  - geography: eu-central
    share: 1.0
    latency_p99_ms: 30
    latency_budget_hard_ms: 60

components:
  - name: api
    service: Microsoft.ContainerService/managedClusters
    classification: restricted
    capabilities: [availability-zones, private-cluster, confidential-nodes]
    capacity:
      capability_class: confidential
      vcpu: 64
      instances: 8
  - name: records-db
    service: Microsoft.DBforPostgreSQL/flexibleServers
    classification: restricted
    capabilities: [zone-redundant-ha, customer-managed-key, private-link, geo-backup]
  - name: audit-log
    service: Microsoft.Storage/storageAccounts
    classification: restricted
    capabilities: [immutable-storage, customer-managed-key]

flows:
  - name: patient-lookup
    type: user
    criticality: high
    path: [api, records-db]
    latency_sensitivity: high
    rto: 4h
    rpo: 15m
    compliance: [iso-27018, c5]
    classification: restricted
    splittable: false          # in-country requirement applies to the whole clinical path

  - name: audit-write
    type: system
    criticality: medium
    path: [api, audit-log]
    latency_sensitivity: low
    rto: 24h
    rpo: 1h
    classification: restricted

resiliency:
  min_availability_zones: 3
  # require_paired_region deliberately unset — CAF no longer treats pairing as
  # mandatory, so the engine chooses the secondary on latency and compliance.

priorities:
  latency: 0.30
  landing_zone_expansion: 0.20
  region_category: 0.20
  cost: 0.20
  capacity_confidence: 0.10
