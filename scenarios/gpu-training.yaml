# Scenario 1 — GPU / AI training placement.
# Stresses: capacity confidence (the weakest signal in the whole engine),
# SKU-level availability, accelerator interconnect, cost sensitivity.
apiVersion: placement/v0
workload: frontier-model-training
owner: ml-platform
description: >
  Multi-node H100 training run. Capacity is the binding constraint; the customer
  will move geography to get metal, but not outside the EU.

residency:
  cloud: public
  jurisdictions: [eu]

demand:
  - geography: eu-west
    share: 1.0

components:
  - name: training-cluster
    kind: ai-training
    service: Microsoft.Compute/virtualMachineScaleSets
    features: [infiniband, ultra-disk]
    capacity:
      capability_class: accelerator
      sku_hints: [Standard_ND96isr_H100_v5]
      accelerators: 512
      instances: 64
      interconnect: infiniband
  - name: checkpoints
    kind: object-storage
    features: [premium-block-blob, zone-redundant-storage]
  - name: dataset
    kind: object-storage
    features: [hierarchical-namespace]

affinity:
  - components: [training-cluster, checkpoints]
    rule: same-region
    reason: Checkpoint write bandwidth makes cross-region egress untenable.
  - components: [training-cluster, dataset]
    rule: same-region

resiliency:
  topology: single
  rto: 24h
  rpo: 1h

priorities:
  capacity_confidence: 0.50
  cost: 0.25
  latency: 0.05
  resiliency: 0.05
  operational_fit: 0.05
  sustainability: 0.10
