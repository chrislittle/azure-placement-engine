# Scenario 3 — standard multi-service application.
# Stresses: multi-service co-location, feature-granular availability across many
# services at once, geo-pairing, and split global demand.
apiVersion: placement/v0
workload: storefront
owner: commerce-web
description: >
  Global e-commerce front end. No single region satisfies both demand centres,
  so the interesting output is an active-active topology, not a winner.

residency:
  cloud: public

compliance:
  scope: [pci-dss]

demand:
  - geography: us-east
    share: 0.55
    latency_p99_ms: 50
  - geography: eu-west
    share: 0.35
    latency_p99_ms: 50
  - geography: apac-southeast
    share: 0.10
    latency_p99_ms: 150

components:
  - name: web
    kind: container-platform
    features: [availability-zones, private-cluster]
    capacity:
      capability_class: general
      vcpu: 128
      instances: 16
  - name: orders-db
    kind: relational-transactional
    classification: confidential
    features: [zone-redundant-ha, read-replicas, customer-managed-key]
  - name: catalog
    kind: document-store
    features: [multi-region-write, availability-zones]
  - name: sessions
    kind: cache
    features: [zone-redundant]
  - name: assets
    kind: object-storage
    features: [zone-redundant-storage]
  - name: search
    kind: search
    required: false
  - name: events
    kind: event-stream
    features: [availability-zones]

affinity:
  - components: [web, orders-db, sessions]
    rule: same-region
    reason: Session affinity and transactional latency.

resiliency:
  topology: active-active
  rto: 5m
  rpo: 1m
  min_availability_zones: 3

priorities:
  latency: 0.30
  cost: 0.20
  resiliency: 0.20
  capacity_confidence: 0.15
  operational_fit: 0.10
  sustainability: 0.05
