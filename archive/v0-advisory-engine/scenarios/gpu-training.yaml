# Scenario 1 — GPU / AI training placement.
# Stresses: capacity confidence (the weakest signal in the engine), SKU-level
# availability, accelerator interconnect, and a flow that must not be split.
apiVersion: placement/v0
workload: frontier-model-training
owner: ml-platform
description: >
  Multi-node H100 training run. Capacity is the binding constraint; the customer
  will move geography to get metal, but not outside the EU.

residency:
  cloud: public
  jurisdictions: [eu]

horizon: 18mo

demand:
  - geography: eu-west
    share: 1.0

components:
  - name: training-cluster
    service: Microsoft.Compute/virtualMachineScaleSets
    capabilities: [infiniband, ultra-disk]
    capacity:
      capability_class: accelerator
      sku_hints: [Standard_ND96isr_H100_v5]
      accelerators: 512
      instances: 64
      interconnect: infiniband
      growth: 2x/12mo
  - name: dataset
    service: Microsoft.Storage/storageAccounts
    capabilities: [hierarchical-namespace, premium-block-blob]
  - name: checkpoints
    service: Microsoft.Storage/storageAccounts
    capabilities: [premium-block-blob, zone-redundant-storage]

flows:
  - name: training-run
    type: system
    criticality: high
    path: [dataset, training-cluster, checkpoints]
    latency_sensitivity: high
    rto: 24h
    rpo: 1h
    splittable: false          # checkpoint write bandwidth makes a cross-region split untenable
    data_volume_gb_month: 400000

priorities:
  capacity_confidence: 0.50
  cost: 0.30
  latency: 0.05
  region_category: 0.10
  landing_zone_expansion: 0.05
