# The decision logic exists twice -- once in HCL for the Terraform path, once in
# PowerShell for the Bicep path. This is what stops the two drifting apart.
#
# Needs no Azure subscription and no credentials: every module under test either
# holds no resources or is pure evaluation.
#
# runs-on comes from repository variables so this works two ways: unset, it uses
# GitHub-hosted runners, which is what anyone cloning this repo wants. Set to a
# self-hosted label, it routes there instead.
#
#   CI_RUNNER_LINUX     e.g. a self-hosted Linux runner label
#   CI_RUNNER_WINDOWS   e.g. a self-hosted Windows runner label
#
# The PowerShell job wants pwsh and the Bicep job wants the Azure CLI, so point
# CI_RUNNER_WINDOWS at a machine that has PowerShell and CI_RUNNER_LINUX at one
# with `az`.

name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    # Both ends of the supported range. The floor catches code that relies on
    # newer behaviour; latest catches deprecations. Testing only one of them has
    # let real defects through in both directions.
    name: Terraform ${{ matrix.terraform }} — unit tests and scenarios
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.8", "latest"]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Formatting
        run: terraform fmt -check -recursive modules examples conformance

      - name: Unit tests
        working-directory: modules/ape-placement
        run: |
          terraform init -backend=false -input=false
          terraform test

      - name: Shared scenarios
        working-directory: conformance/terraform
        run: |
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false

  powershell:
    name: PowerShell — shared scenarios
    runs-on: ${{ vars.CI_RUNNER_WINDOWS || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Shared scenarios
        shell: pwsh
        run: ./conformance/powershell/Invoke-Conformance.ps1 -Detailed

  bicep:
    name: Bicep — template compiles
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: az bicep build --file bicep/ape-apply.bicep --stdout > /dev/null
