# How Azure Quota Groups actually behave.
#
# The feature's pitch is "self-service quota without support tickets". That is
# true of one operation and not the other, and the difference decides what AQV
# can promise at vending time.
reviewed: 2026-09-19
source: >
  Microsoft Learn, read 2026-09-16:
  learn.microsoft.com/azure/quotas/quota-groups
  learn.microsoft.com/azure/quotas/transfer-quota-groups
  learn.microsoft.com/azure/quotas/quota-group-limit-increase

  Plus live READ calls on 2026-09-19 against an existing group in an ordinary
  tenant. Anything under `verified_reads` below came from the API. Everything
  else is still documentation only.
confidence: mixed -- see verified_reads
recheck_after: 2026-12-31

# Read on 2026-09-19 against a real Microsoft.Quota/groupQuotas object, on an
# MCA-Individual tenant. The group existed and was readable. No write was
# attempted, and the group holds no quota, so none of this covers what happens
# when a group has cores in it.
#
# Several of these contradict what the rest of this file says. The contradictions
# are marked. They are why the collector exists.
verified_reads:
  # --- The group object -------------------------------------------------
  group_object:
    path: GET /providers/Microsoft.Management/managementGroups/{mg}/providers/Microsoft.Quota/groupQuotas/{group}
    returns: |
      {"properties": {
         "displayName": "HomeQG",
         "groupType": "AllocationGroup",
         "provisioningState": "Succeeded",
         "additionalAttributes": {
           "groupId": {"groupingIdType": "BillingId", "value": "temp-billing-id"},
           "environment": "None"}},
       "id": ".../groupQuotas/homeqg",
       "type": "Microsoft.Quota/groupQuotas",
       "name": "homeqg"}
    note: >
      `groupType: AllocationGroup` is an enum nobody documented. Paired with the
      enforcement error below, there is at least one other kind of group, and the
      two are not equally capable.

  # --- THE ONE THAT BREAKS THINGS --------------------------------------
  family_name_casing:
    finding: >
      quotaAllocations returns every resource name in ALL LOWERCASE.
    measured: >
      Both APIs returned 232 names for the same subscription and region. ONE
      matched case sensitively. 231 of 232 differ by case alone.
    side_by_side:
      group_api:   [lowprioritycores, cores, virtualmachines, availabilitysets, virtualmachinescalesets]
      compute_api: [lowPriorityCores, cores, virtualMachines, availabilitySets, virtualMachineScaleSets]
    against: >
      Microsoft.Compute/locations/{region}/usages returns camel case, and is
      itself inconsistent between families: standardDFamily, StandardDsv6Family,
      standardDSv5Family.
    consequence: >
      AQV keys every decision on the family name. A direct join between group
      state and per-subscription quota WILL miss. Any group support has to
      normalise case on both sides before comparing. This is answer B2 in the
      collector, and it is the single most important thing found so far.
    severity: blocking

  # --- Reading an empty group ------------------------------------------
  group_quota_limits:
    path: GET {group}/resourceProviders/Microsoft.Compute/groupQuotaLimits/{location}
    on_empty_group: 'HTTP 200 with body {} -- an empty object, not 404, not an error'
    consequence: >
      A client must read {} as "this group holds nothing", not as a failure and
      not as "unknown". Treating it as unknown would make AQV fall back to
      needs_increase when the right answer is that the pool is empty.
    tested_api_versions: [2025-09-01, 2025-03-01, 2024-12-18-preview]
    note: Identical empty response on all three.

  quota_allocations_read:
    path: >
      GET /providers/Microsoft.Management/managementGroups/{mg}/subscriptions/{sub}
      /providers/Microsoft.Quota/groupQuotas/{group}/resourceProviders/Microsoft.Compute
      /quotaAllocations/{location}
    returns_per_family: [resourceName, limit, 'name.value', 'name.localizedValue', shareableQuota]
    observed: >
      Returned every family with the SUBSCRIPTION's own limit and
      shareableQuota: 0 throughout, on a subscription that is NOT a member of
      the group. So this read does not prove membership and does not fail when
      the subscription is outside the group.
    consequence: >
      Membership has to be checked through groupQuotas/{group}/subscriptions. A
      successful quotaAllocations read is not evidence of anything.
    unknown: What shareableQuota holds once a group actually has cores in it.

  # --- Enforcement, which no doc we read mentions ----------------------
  enforcement:
    finding: >
      GET locationUsages/{location} returns HTTP 405:
      "Get Group Usages API is supported for enforced groups only. Please ensure
      group '{group}' in location '{location}' is enforced and try again."
    and: >
      GET locationSettings/{location} returns HTTP 404 EntityNotFound:
      "EnforcementStatus is not found for GroupId: {group}, MgId: {mg}".
      The list form returns 200 with {"value": [], "nextLink": ""}.
    consequence: >
      There is a per-group, per-location enforcement state, set through
      groupQuotas/{group}/resourceProviders/{rp}/locationSettings, and the
      aggregate usage read does not work until it is on. Nothing in
      learn.microsoft.com/azure/quotas/quota-groups covers this.
    write_attempted: >
      PUT {group}/resourceProviders/Microsoft.Compute/locationSettings/{location}
      with {"properties": {"enforcementEnabled": "Enabled"}} on 2026-09-19.
      ACCEPTED: HTTP 201, Retry-After 30, and an Azure-AsyncOperation header
      pointing at groupQuotas/{group}/locationSettingsOperationsStatus/{guid}.
      The body came back as
      {"properties": {"enforcedGroupName": "homeqg-centralus",
                      "provisioningState": "ACCEPTED"},
       "type": "Microsoft.Quota/locationSettings", "name": "centralus"}
    but_never_landed: >
      Twenty minutes and two attempts later, locationSettings still returns 404
      EntityNotFound, locationUsages still returns 405, and the group object is
      unchanged at groupType AllocationGroup. The write was accepted and did
      nothing.
    what_that_means: >
      A 201 on this endpoint proves NOTHING. It is accepted before eligibility
      is evaluated, exactly like the 202 on a per-subscription quota PUT. Any
      client, AQV included, has to read the state back rather than trust the
      submit.

      The tenant tested is MCA-Individual, so the most likely explanation is the
      billing account gate applying asynchronously. That is a guess. The
      collector is what settles it.
    field_name_confirmed: >
      enforcementEnabled, taking the string "Enabled". Three other shapes were
      queued behind it and never needed: the first was accepted.
    new_field: >
      enforcedGroupName, "{group}-{location}". An enforced group appears to get
      a derived per-location name. Nothing documents it.
    unknown: >
      What enforcement changes besides unlocking locationUsages, whether it is
      required for allocation at all, and whether it can be turned off again.
      Also whether it ever succeeds on an ineligible account or fails silently
      forever.
    severity: blocking

  # --- Server errors on a documented type -------------------------------
  quota_allocation_requests_500:
    path: GET {group}/resourceProviders/Microsoft.Compute/quotaAllocationRequests
    returns: 'HTTP 500 {"error": {"code": "UnknownFailure", "message": "The service has encountered an unknown internal failure"}}'
    tested_api_versions: [2025-09-01, 2025-07-15]
    note: >
      Reproducible on both. Either the list form needs a filter it does not ask
      for, or it does not work on a group with no requests. aqv-apply cannot
      poll a request type whose list form 500s, so the collector must find the
      working read shape.

  group_quota_requests_filter:
    path: GET {group}/groupQuotaRequests
    without_filter: 'HTTP 400 {"error": {"code": "BadRequest", "message": "$filter not found in request query."}}'
    with_filter: "HTTP 200 with ?$filter=location eq '{location}'"
    note: The filter is mandatory and the error says so clearly.

  subscriptions_list_shape:
    path: GET {group}/subscriptions
    returns: '{"value": [], "values": []}'
    note: >
      Both spellings, in the same body. Key on `value`; the duplicate suggests
      schema churn and may not survive.

  # --- A second mechanism nobody knew about -----------------------------
  quota_transfers:
    finding: >
      Microsoft.Quota exposes quotaTransfers and incomingQuotaTransfers at
      api-version 2026-09-01-preview and 2026-09-01-alpha. Both return HTTP 200
      with {"value": []} on an ordinary subscription.
    scope: subscription, not management group
    consequence: >
      This is a subscription-to-subscription transfer path that does not go
      through a quota group at all. If it is self-service it may be a better
      fit for AQV than group quotas, because it needs no management group and
      no group object. It is also preview/alpha only.
    unknown: Everything except that the endpoints exist and are readable.
    severity: investigate

  # --- WHERE THE ELIGIBILITY GATE ACTUALLY IS ---------------------------
  eligibility_gate:
    finding: >
      Membership is the gate, and it is SYNCHRONOUS. Adding a subscription to a
      group returns HTTP 400 immediately:
      "{sub} is not eligible to use Group Quota functionality. QuotaId does not
      contain EnterpriseAgreement or Internal"
    measured: >
      Tried on 2026-09-19 against a real group, with two subscriptions:
      PayAsYouGo_2014-09-01 and MSDN_2014-09-01. Both refused, 400 in about
      1.2 seconds, nothing added to the group.
    not_gated: >
      Creating a group is NOT gated: a Microsoft.Quota/groupQuotas object exists
      and reads normally on an MCA-Individual tenant. Neither is reading any of
      the group APIs. Only membership is.
    checkable_before_trying: >
      GET /subscriptions/{id}?api-version=2022-12-01 returns
      subscriptionPolicies.quotaId. The gate is a substring test on that value,
      so AQV can decide a subscription is ineligible with one read and no write.
      Observed values that FAIL: PayAsYouGo_2014-09-01, MSDN_2014-09-01.
    contradicts: >
      constraints.billing_accounts above says [EA, MCA, Internal]. The error
      message names only EnterpriseAgreement and Internal. Either an
      MCA-Enterprise subscription carries a quotaId that CONTAINS
      "EnterpriseAgreement" -- plausible, since subscriptions migrated from EA
      often keep EnterpriseAgreement_2014-09-01 -- or MCA is not supported at
      all despite the documentation. Unresolved, and it decides who can use
      this feature.
    implication_for_aqv: >
      A precondition check in aqv-read, not a failure at apply time. Read the
      quotaId, and when it contains neither string, report the subscription as
      outside the group path instead of letting a write fail later.
    severity: answered

  # --- The API version spread was wrong ---------------------------------
  api_versions:
    finding: >
      GET /subscriptions/{sub}/providers/Microsoft.Quota lists every groupQuotas
      child type with the SAME api-version set:
      2025-09-01, 2025-07-15, 2025-03-01, 2024-12-18-preview, 2024-10-15-preview,
      2023-06-01-preview.
    contradicts: >
      The iac_support block below, which records four types on four different
      versions. That spread is azapi's schema index, not the service. The
      service is consistent.
    also: >
      2026-09-01-preview does NOT exist for groupQuotas. The service names its
      supported set in the 404, which is the quickest way to check.
  # --- azapi, tested with terraform plan on 2026-09-19 ------------------
  terraform_azapi:
    provider: Azure/azapi >= 2.0, terraform 1.15.8
    type_not_in_schema: >
      Microsoft.Quota/groupQuotas/quotaAllocations@2025-09-01 is NOT in azapi's
      embedded schema. terraform plan fails with "resource type
      Microsoft.Quota/groupQuotas/quotaAllocations can't be found".
    workaround: schema_validation_enabled = false on the resource block
    body_accepted: >
      WITH validation off, azapi accepts a full body -- properties.value[] with
      resourceName and limit -- and terraform plan resolves cleanly.
    contradicts: >
      request_shaped_warning below, which says the published azapi schema
      carries no body at all and that the write is therefore fire-and-forget.
      It takes a body. The obstacle is the missing schema entry, not the shape
      of the resource.
    still_unknown: >
      Whether the body is SENT correctly and whether a second plan is empty.
      Only an apply against a real group answers that, which is question H2.

  # --- Group naming, enforced by the azapi schema -----------------------
  group_name_pattern:
    pattern: '^[a-z][a-z0-9]*$'
    finding: >
      A quota group name must be lower case letters and digits, starting with a
      letter. A hyphen is rejected: "name is invalid, string does not match
      pattern ^[a-z][a-z0-9]*$".
    note: >
      Found by trying 'aqv-collector', which is the obvious name to reach for.
      Nothing in the documentation mentions the constraint.

    child_types:
      - groupQuotas/groupQuotaLimits
      - groupQuotas/quotaAllocations
      - groupQuotas/quotaAllocationRequests
      - groupQuotas/groupQuotaRequests
      - groupQuotas/subscriptions
      - groupQuotas/subscriptionRequests
      - groupQuotas/locationSettings
      - groupQuotas/locationUsages
      - groupQuotas/groupOperationsStatus
      - groupQuotas/groupQuotaOperationsStatus
      - groupQuotas/quotaAllocationOperationsStatus
      - groupQuotas/locationSettingsOperationsStatus
      - groupQuotas/subscriptionRequestsOperationsStatus

# The central distinction. Conflating these two would make AQV promise a
# deployment it cannot deliver.
operations:
  allocate:
    what: Move quota between the group and a subscription in it.
    path: >
      PATCH /providers/Microsoft.Management/managementGroups/{mg}/subscriptions/{sub}
      /providers/Microsoft.Quota/groupQuotas/{group}/resourceProviders/Microsoft.Compute
      /quotaAllocations/{location}
    approval: none -- genuinely self-service, no Microsoft involvement
    timing: async, "may take several minutes"
    note: This is the operation vending depends on.

  raise_group_limit:
    what: Increase the group's own limit.
    path: >
      PATCH /providers/Microsoft.Management/managementGroups/{mg}
      /providers/Microsoft.Quota/groupQuotas/{group}/resourceProviders/Microsoft.Compute
      /groupQuotaLimits/{location}
    approval: >
      evaluated, NOT guaranteed. Subject to the same checks as a subscription-level
      request and rejected outright if regional capacity is low.
    timing: async -- 202 with a Location header and Retry-After 30; poll groupQuotaRequests/{id}
    on_reject: >
      No API path. A rejected request must be escalated as a support ticket through
      the portal's Quota Group blade. The ticket is raised against a subscription in
      the group, but approved quota is still stamped at the group level.
    note: >
      This is the slow, uncertain path, and it is why the group must be filled
      ahead of vending rather than during it.

# `limit` is the new ABSOLUTE value, never a delta. Sub at 10, want to give it
# 10 more -> PATCH limit: 20. Deallocation is the same call with a lower number.
# This is what makes the whole thing expressible as declarative IaC.
limit_semantics: absolute

# A new group starts at zero and stays there until deliberately filled.
filling_the_group:
  transfer_in:
    what: Deallocate unused quota from existing subscriptions into the group.
    approval: none -- self-service
    note: >
      The underrated path. An estate whose subscriptions sit on unused quota can
      quota it and redistribute to new vendings without ever contacting Microsoft.
      For a vending platform this is likely the primary source, not increase requests.
  request:
    what: A group limit increase request.
    approval: evaluated -- see raise_group_limit

# Reading the group snapshot. These three do not mean the same thing.
snapshot_fields:
  availableLimit: total cores available at group level to distribute
  limit: cores explicitly stamped via approved increase requests
  quotaAllocated: >
    per-subscription; NEGATIVE means cores were moved from that subscription
    INTO the group. Same sign convention as `shareableQuota` on the allocation.

# Quota groups solve quota. They do not solve access, and Microsoft says so
# twice in its own docs. This preserves the two-gate model: a subscription
# without regional or zonal access will fail BOTH the quota transfer and the
# deployment, no matter how much group quota is pointed at it.
does_not_solve:
  - regional access
  - zonal access

constraints:
  billing_accounts: [EA, MCA, Internal]     # PAYG and personal are excluded
  resources: IaaS compute only
  clouds: public only
  group_membership: a subscription may belong to only ONE quota group at a time
  rp_registration: Microsoft.Quota and Microsoft.Compute on every participating subscription
  roles:
    - GroupQuota Request Operator on the management group holding the group
    - Quota Request Operator on every participating subscription
    - Reader on every participating subscription (for portal visibility)

# Read from the live role definition API on 2026-09-19, not from a doc page.
# The role exists on an ordinary subscription, so its DEFINITION is visible
# without an eligible billing account even though the feature is not usable.
group_quota_role:
  id: e2217c0e-04bb-4724-9580-91cf9871bc01
  name: GroupQuota Request Operator
  description: >
    Read and create GroupQuota requests, get GroupQuota request status, and get
    groupQuotaLimits.
  assignable_scopes: ["/"]   # any scope, not management group only
  not_actions: []
  actions:
    - Microsoft.Authorization/*/read
    - Microsoft.Insights/alertRules/read
    - Microsoft.Quota/quotas/write
    - Microsoft.Quota/quotas/read
    - Microsoft.Quota/usages/read
    - Microsoft.Quota/quotaRequests/read
    - Microsoft.Quota/register/action
    - Microsoft.Quota/groupQuotas/*/read
    - Microsoft.Quota/groupQuotas/*/write
    - Microsoft.Quota/groupQuotas/*/delete
  note: >
    It carries Microsoft.Quota/quotas/write, which is the PER-SUBSCRIPTION write
    that Quota Request Operator exists for. So the roles list above overstates
    what is needed: this one role covers both halves of the write path. It does
    NOT carry Microsoft.Support/*, so a refused request still needs a role that
    can raise a ticket.

    Whether it has to be assigned at the management group for the group
    operations to work is not settled by the definition. assignableScopes is "/"
    so it CAN be assigned anywhere; the group operations are scoped to the
    management group, so an assignment at subscription scope would not cover
    them. The collector's step 3 is what proves this.
  verified: 2026-09-19
  verified_how: >
    GET /subscriptions/{sub}/providers/Microsoft.Authorization/roleDefinitions
    ?$filter=roleName eq 'GroupQuota Request Operator', api-version 2022-04-01.

# The group is a global ARM object under an MG, but membership is NOT synced
# from the MG hierarchy -- subscriptions from any MG can join. So the MG you
# create the group under is purely an access-control choice.
scoping_note: >
  Quota groups are orthogonal to management-group hierarchy. Choose the parent MG
  for who should be able to operate the group, not for where the subscriptions sit.

# Sharp edge worth knowing before someone tidies up a management group.
mg_deletion_warning: >
  Deleting the management group loses access to the group limit. Recovery is to
  recreate the MG with the same ID. To wind a group down cleanly: allocate cores
  back out to subscriptions, delete the subscriptions, delete the group object,
  then delete the MG.

# Reading state for a reallocation. Two different shapes, both needed.
reading_state:
  group_aggregate:
    path: >
      GET /providers/Microsoft.Management/managementGroups/{mg}/providers/Microsoft.Quota
      /groupQuotas/{group}/resourceProviders/Microsoft.Compute/locationUsages/{location}
    api_version: 2025-09-01
    returns: per-family `limit` and `usages` for the GROUP as a whole
    note: Microsoft.Compute is currently the only RP supporting this API.
  per_subscription:
    note: >
      locationUsages is aggregate only -- it cannot tell you WHICH subscription
      is sitting on idle quota. That needs a fan-out read of
      Microsoft.Compute/locations/{region}/usages per member subscription, plus
      `allocatedToSubscriptions` from the groupQuotaLimits snapshot.

# Terraform reachability, checked 2026-09-16.
iac_support:
  azurerm: none -- hashicorp/terraform-provider-azurerm#29849 open
  azapi:
    Microsoft.Quota/groupQuotas: 2026-09-01-preview
    Microsoft.Quota/groupQuotas/subscriptions: 2025-09-01
    Microsoft.Quota/groupQuotas/resourceProviders/quotaAllocationRequests: 2025-07-15
    Microsoft.Quota/groupQuotas/resourceProviders/groupQuotaRequests: 2023-06-01-preview
  version_spread_warning: >
    Four types across four API versions, none of which is the 2025-03-01 the
    how-to docs use. Pin deliberately and expect churn.
  request_shaped_warning: >
    Allocation is modelled as quotaAllocation*Requests*, not as a desired-state
    resource, and the published azapi schema carries NO body at all -- only
    name, parent_id and type. A request object with no readable desired state
    is something Terraform cannot diff, so the write behaves as fire-and-forget
    rather than as converging state.
  allocation_pattern: >
    The workable shape is therefore read-compare-write rather than plain desired
    state: a data source GETs the current quotaAllocations for the region, the
    decision module computes the target limits, and the write is issued only
    where the two differ. Deterministic and expressible, but not idiomatic
    Terraform, and worth prototyping before the rest is built on it.

# Nobody has built this yet, in either toolchain.
ecosystem:
  avm: no quota-group module exists, Bicep or Terraform
  vending: >
    Azure/terraform-azurerm-lz-vending is ARCHIVED and migrated to
    Azure/avm-ptn-sub-vending/azurerm. Neither it nor the Bicep
    avm/ptn/lz/sub-vending does anything with quota -- confirmed against the
    module's own feature list, which covers subscription creation, MG placement,
    networking, role assignments, RP registration, resource groups, managed
    identities, NSGs, route tables and budgets. Quota is simply absent.

# Transferring idle quota is self-service and is the most useful thing AQV can do
# with this feature. It is also taking cores from a subscription someone else
# owns, so the authorisation must not come from a usage reading.
reallocation_note: >
  Current usage is a point-in-time number. A subscription reading 40 of 500 may
  be a scale set that bursts to 480 nightly, and harvesting to usage-plus-margin
  would break it. Owners should declare a floor they keep; usage informs the
  recommendation, the declaration authorises the take.

# A trap that cost a debugging round, and would cost anyone else one.
async_poll_urls:
  finding: >
    The Location and Azure-AsyncOperation headers on a Microsoft.Quota
    long-running operation carry a SIGNED query string -- t, c, s and h
    parameters alongside api-version.
  do_not: >
    Rewrite any part of it. Stripping api-version to re-add it, or rebuilding
    the URL from the path, breaks the signature and the poll returns
    401 AuthorizationFailed: "Unable to verify that the user that sent this
    request is the original caller of the asynchronous operation being polled."
  consequence: >
    That error reads like a permissions problem and is not one. It is the same
    message seen when polling a quota operation as a different principal, so the
    two are easy to confuse. Use the header verbatim.
