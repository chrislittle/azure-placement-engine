# Mapping a workload requirement to Azure VM families, in Azure's own vocabulary.
#
# The category names are Azure Compute Fleet's `vmCategories` enum. We do not
# use Compute Fleet -- this is VM vending, not fleet management -- but the names
# are Azure's published taxonomy for exactly this question, and inventing a
# parallel one would have been jargon for its own sake.
#
# The same vocabulary means a request written for APE can be handed to Compute
# Fleet later without translation, if anyone ever wants that.
reviewed: 2026-09-16
source: >
  Category names from learn.microsoft.com/azure/azure-compute-fleet/attribute-based-vm-selection
  (`vmCategories`). Membership derived from Microsoft.Compute/skus capabilities
  across eastus, westeurope, westus2 and centralus, 2026-09-16 -- 180 families.
confidence: high
recheck_after: 2027-03-31

categories: [GeneralPurpose, ComputeOptimized, MemoryOptimized, StorageOptimized,
  GpuAccelerated, FpgaAccelerated, HighPerformanceCompute]

# Evaluated in this order. Accelerators and RDMA beat shape, because Azure
# classifies by what the hardware is for, not by its memory ratio: NCSv3 sits at
# 18.7 GiB per vCPU and is GpuAccelerated, not MemoryOptimized.
precedence:
  - name: FpgaAccelerated
    rule: family name matches ^standardNP
    why: >
      MUST be tested before GpuAccelerated. NP-series reports a GPUs capability
      even though its accelerators are FPGAs, so checking GPUs first puts every
      NP family in the wrong category.
  - name: GpuAccelerated
    rule: any size reports GPUs greater than zero
    capability: GPUs
  - name: HighPerformanceCompute
    rule: any size reports RdmaEnabled true
    capability: RdmaEnabled
    why: >
      Replaces an earlier guess based on the ^standardH name. RdmaEnabled is
      present on all 1420 SKUs and true on 37, so this is measured rather than
      inferred -- and it correctly catches HB, HC and HX, which scatter across
      all three ratio bands and are a workload class rather than a shape.
  - name: StorageOptimized
    rule: family name matches ^standardL
    why: >
      Not derivable. L8s_v3 and E8s_v5 are both 8 GiB per vCPU, and local disk
      size does not separate them -- 571 of 1420 SKUs report local storage.
  - name: by memory ratio
    capability: MemoryGB divided by vCPUs, median across the family's sizes
    bands:
      ComputeOptimized: "< 3"      # F8s_v2 = 2.0
      GeneralPurpose: "3 to 6"     # D8s_v5 = 4.0
      MemoryOptimized: "> 6"       # E8s_v5 = 8.0
    note: >
      Azure names this attribute memoryInGiBPerVCpu, which is the same ratio.

# NOT categories. Azure models these as separate attributes, and it is the
# better model -- a burstable family is also general-purpose shaped, and a
# confidential one is general- or memory-optimised with an extra capability.
# Treating either as a category would hide it from anyone asking for its shape.
flags:
  burstable:
    rule: family name matches ^standardB
    note: Azure's equivalent is burstableSupport (Excluded, Required, Included).
  confidential_computing:
    rule: any size reports a ConfidentialComputingType
    capability: ConfidentialComputingType
    note: >
      68 SKUs across 15 families report SNP. An earlier name match on
      ^standard(DC|EC) caught 19 families, so the capability is more accurate.
  architecture:
    rule: CpuArchitectureType, present on every SKU
    capability: CpuArchitectureType
    values: [x64, Arm64]
    note: Azure's equivalent is architectureTypes. 98 of 1420 SKUs are Arm64.
  local_storage:
    rule: MaxResourceVolumeMB greater than zero
    capability: MaxResourceVolumeMB
    note: Azure's equivalent is localStorageSupport.

# If a rule change moves any of these, the rules are wrong.
expected:
  standardFSv2Family: ComputeOptimized
  standardDSv5Family: GeneralPurpose
  standardESv5Family: MemoryOptimized
  standardNCSv3Family: GpuAccelerated
  standardNPSFamily: FpgaAccelerated
  standardLSv3Family: StorageOptimized
  standardHBv3Family: HighPerformanceCompute
  standardBSFamily: GeneralPurpose        # burstable is a flag, not a category
  standardDCASv5Family: GeneralPurpose    # confidential is a flag, not a category
  standardECASv5Family: MemoryOptimized
