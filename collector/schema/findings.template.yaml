  - id: F3
    question: Is any refusal retryable? Does the same request ever succeed later?
    unblocks: Retry policy. AQV treats every quota refusal as terminal today.
    answer: null
    capture: null

# ---------------------------------------------------------------------------
# G. quotaTransfers, a second mechanism                         (step 7)
#
# Microsoft.Quota exposes quotaTransfers and incomingQuotaTransfers at
# 2026-09-01-preview and -alpha. Both read 200 with an empty list on an ordinary
# subscription. No documentation we have found covers them. They are scoped to a
# SUBSCRIPTION, not a management group, so if they are self-service they may
# suit AQV better than quota groups.
# ---------------------------------------------------------------------------
transfers:
  - id: G1
    question: >
      What does a quotaTransfers object look like, and what does creating one
      take?
    unblocks: Whether AQV should build on this instead of, or as well as, groups.
    answer: null
    capture: null

  - id: G2
    question: >
      Is a transfer subscription-to-subscription, and does it need a management
      group or a group object at all?
    unblocks: Whether the management group prerequisite can be dropped.
    answer: null
    capture: null

  - id: G3
    question: Does it need approval from the receiving subscription?
    unblocks: >
      incomingQuotaTransfers implies a two-sided handshake. If it does, that is
      a different automation shape from a one-sided allocation.
    answer: null
    capture: null

  - id: G4
    question: Is it available on the partner's billing account type at all?
    unblocks: Whether this is worth any further time.
    answer: null
    capture: null

# ---------------------------------------------------------------------------
# H. Infrastructure as code                                     (step 7)
# ---------------------------------------------------------------------------
iac:
  - id: H1
    question: >
      Does azapi accept a body for quotaAllocations, or only name, parent_id and
      type?
    unblocks: >
      Whether allocation is expressible as Terraform desired state at all. With
      no body the write is fire-and-forget and aqv-apply needs a
      read-compare-write shape instead.
    answer: null
    capture: null
    notes: >
      Every groupQuotas child type supports the same api-version set:
      2025-09-01, 2025-07-15, 2025-03-01, 2024-12-18-preview, 2024-10-15-preview,
      2023-06-01-preview. Pin 2025-09-01 unless something argues otherwise.

  - id: H2
    question: >
      Does a second `terraform apply` with no change produce an empty plan, or
      re-issue the request?
    unblocks: >
      Whether the module converges. A resource that re-issues on every run is
      not usable in a pipeline that runs on every push.
    answer: null
    capture: null

  - id: H3
    question: Is there an azurerm resource for any of this yet?
    unblocks: Whether to build on azapi or wait.
    answer: null
    capture: null

