    answer: null
    capture: null

  - id: F2
    question: >
      Allocating for a family under the July 2026 capacity growth restrictions.
    unblocks: >
      Whether the lifecycle gate applies to the group path, or whether group
      quota routes around a growth restriction.
    answer: null
    capture: null
    notes: >
      Use a family from knowledge/vm-series-lifecycle.yaml. A significant
